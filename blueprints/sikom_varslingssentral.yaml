blueprint:
  name: Sikom Varslingssentral
  description: >
    Varsler ekte endringer for Sikom – og skiller mellom NETTUTFALL (connection) og STRØMBRUDD (230V).
    • Nettutfall: connection (on/off) med stabiliseringsvindu (unngå falske alarmer)
    • Strømbrudd: spenningssensor (under terskel en periode, friskmelding med hysterese)
    • Klima/switch: varsler på endringer med stabiliseringsvinduer og debounce
    • Sikom alarm (gateway): valgfritt, trigges kun hvis input er satt
  domain: automation
  source_url: https://raw.githubusercontent.com/Howard0000/home-assistant-sikom/main/blueprints/sikom_varslingssentral.yaml

  input:
    # --- Klima ---
    climate_entities:
      name: Termostater som skal overvåkes (valgfritt)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate

    critical_temperature:
      name: Kritisk temperatur – under (°C)
      default: 5
      selector:
        number:
          min: -10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"

    preset_window_sec:
      name: Stabiliseringsvindu – preset_mode (sek)
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: s

    target_window_sec:
      name: Stabiliseringsvindu – temperature (sek)
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: s

    # --- Bryter ---
    switch_entity:
      name: Bryter som skal overvåkes (valgfritt)
      default: ""
      selector:
        entity:
          filter:
            - domain: switch

    switch_window_min:
      name: Stabiliseringsvindu – bryter (min)
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    # --- NETTUTFALL (connection) ---
    connection_sensor:
      name: Nettstatus (binary_sensor device_class connectivity) (valgfritt)
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: connectivity

    connection_offline_min:
      name: Nettutfall – offline i (min)
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    connection_online_min:
      name: Nett tilbake – online i (min)
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    # --- STRØMBRUDD (voltage) ---
    voltage_entity:
      name: Spenningssensor (V) (valgfritt)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor

    threshold_v:
      name: Strømbrudd – terskel (V)
      default: 50
      selector:
        number:
          min: 10
          max: 230
          step: 1
          unit_of_measurement: V

    fail_for_min:
      name: Strømbrudd – under terskel i (min)
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    back_for_min:
      name: Strøm tilbake – over terskel i (min)
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    back_threshold_v:
      name: Strøm tilbake – terskel (V)
      default: 55
      selector:
        number:
          min: 10
          max: 230
          step: 1
          unit_of_measurement: V

    # --- Felles ---
    notify_device:
      name: Varslingsenhet (mobile_app)
      selector:
        device:
          filter:
            - integration: mobile_app

    # --- Sikom alarm (gateway) – VALGFRITT ---
    gateway_alarm:
      name: Sikom alarm (gateway)
      description: Binary sensor som indikerer aktiv alarm fra Sikom gateway
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: problem

    gateway_alarm_message:
      name: Sikom alarmmelding
      description: Tekstsensor med alarmmelding fra Sikom gateway
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor

    location_name:
      name: Stedsnavn
      default: "Hytta"

    debug_mode:
      name: Debug (skriv til loggbok)
      default: false
      selector:
        boolean: {}

mode: parallel
max: 10

# Viktig: trigger_variables gjør inputs tilgjengelig i triggers (template-triggers)
trigger_variables:
  voltage_entity: !input voltage_entity
  gateway_alarm: !input gateway_alarm
  gateway_alarm_message: !input gateway_alarm_message
  thr_v: !input threshold_v
  fail_min: !input fail_for_min
  back_min: !input back_for_min
  back_thr: !input back_threshold_v
  connection_sensor: !input connection_sensor
  switch_entity: !input switch_entity
  location_name: !input location_name
  debug_mode: !input debug_mode

variables:
  climate_entities: !input climate_entities
  switch_entity: !input switch_entity
  connection_sensor: !input connection_sensor
  voltage_entity: !input voltage_entity
  gateway_alarm: !input gateway_alarm
  gateway_alarm_message: !input gateway_alarm_message

  location_name: !input location_name

  sw_min: !input switch_window_min
  preset_win: !input preset_window_sec
  target_win: !input target_window_sec

  conn_off_min: !input connection_offline_min
  conn_on_min: !input connection_online_min

  thr_v: !input threshold_v
  fail_min: !input fail_for_min
  back_min: !input back_for_min
  back_thr: !input back_threshold_v

  debug_mode: !input debug_mode

trigger:
  # --- Klima: sikkerhet ---
  - platform: numeric_state
    id: kritisk_temp
    entity_id: !input climate_entities
    attribute: current_temperature
    below: !input critical_temperature
    for: "00:01:00"

  # --- Klima: endringer ---
  - platform: state
    id: klima_preset
    entity_id: !input climate_entities
    attribute: preset_mode

  - platform: state
    id: klima_target
    entity_id: !input climate_entities
    attribute: temperature

  # --- Bryter ---
  - platform: state
    id: bryter
    entity_id: !input switch_entity

  # --- NETTUTFALL (connection) ---
  - platform: state
    id: nett_off
    entity_id: !input connection_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input connection_offline_min

  - platform: state
    id: nett_on
    entity_id: !input connection_sensor
    from: "off"
    to: "on"
    for:
      minutes: !input connection_online_min

  # --- STRØMBRUDD (voltage) ---
  - platform: template
    id: power_fail
    value_template: >
      {{ voltage_entity != ''
         and states(voltage_entity) not in ['unknown','unavailable','none','']
         and (states(voltage_entity) | float(999)) < (thr_v | float(0)) }}
    for:
      minutes: !input fail_for_min

  - platform: template
    id: power_back
    value_template: >
      {{ voltage_entity != ''
         and states(voltage_entity) not in ['unknown','unavailable','none','']
         and (states(voltage_entity) | float(0)) > (back_thr | float(0)) }}
    for:
      minutes: !input back_for_min

  # --- SIKOM ALARM (gateway) – VALGFRITT ---
  - platform: template
    id: sikom_alarm
    value_template: >
      {{ gateway_alarm != '' and is_state(gateway_alarm, 'on') }}

action:
  - choose:

      # ---------- SIKOM ALARM (gateway) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'sikom_alarm' }}"
        sequence:
          - variables:
              _msg: >-
                {% if gateway_alarm_message != '' %}
                  {{ states(gateway_alarm_message) | default('Ukjent alarm fra Sikom', true) }}
                {% else %}
                  Ukjent alarm fra Sikom
                {% endif %}

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[Alarm] på {{ location_name }}"
            message: "{{ _msg }}"

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - service: logbook.log
                data:
                  name: "Sikom Debug"
                  message: "Alarm mottatt: {{ _msg }}"

      # ---------- KLIMA: kritisk temperatur ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'kritisk_temp' }}"
        sequence:
          - variables:
              _name: "{{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}"
              _temp: "{{ state_attr(trigger.entity_id, 'current_temperature') }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[Lav temperatur] på {{ location_name }}"
            message: "⚠️ {{ _name }} har nå {{ _temp }}°C (under kritisk grense)."

      # ---------- KLIMA: preset_mode (debounce med delay) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_preset' }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _name: "{{ state_attr(_eid, 'friendly_name') or _eid }}"
              _old: "{{ trigger.from_state.state if trigger.from_state else 'unknown' }}"
              _new: "{{ trigger.to_state.state if trigger.to_state else 'unknown' }}"

          - delay:
              seconds: "{{ preset_win }}"

          - condition: template
            value_template: >
              {{ is_state_attr(_eid, 'preset_mode', _new)
                 and (_new != _old) }}

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[Preset endret] på {{ location_name }}"
            message: "{{ _name }}: {{ _old }} → {{ _new }}"

      # ---------- KLIMA: target temp (debounce med delay) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_target' }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _name: "{{ state_attr(_eid, 'friendly_name') or _eid }}"
              _old: "{{ trigger.from_state.attributes.temperature if trigger.from_state else 'unknown' }}"
              _new: "{{ trigger.to_state.attributes.temperature if trigger.to_state else 'unknown' }}"

          - delay:
              seconds: "{{ target_win }}"

          - condition: template
            value_template: >
              {{ (state_attr(_eid, 'temperature') | float(0)) == (_new | float(0))
                 and (_new | float(0)) != (_old | float(0)) }}

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[Temperatur endret] på {{ location_name }}"
            message: "{{ _name }}: {{ _old }}°C → {{ _new }}°C"

      # ---------- BRYTER (debounce med delay) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'bryter' }}"
        sequence:
          - variables:
              _old: "{{ trigger.from_state.state if trigger.from_state else 'unknown' }}"
              _new: "{{ trigger.to_state.state if trigger.to_state else 'unknown' }}"

          - delay:
              minutes: "{{ sw_min }}"

          - condition: template
            value_template: >
              {{ switch_entity != ''
                 and is_state(switch_entity, _new)
                 and (_new != _old) }}

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[Bryter endret] på {{ location_name }}"
            message: "Bryter: {{ _old }} → {{ _new }}"

      # ---------- NETTUTFALL ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['nett_off','nett_on'] }}"
        sequence:
          - variables:
              _state: "{{ states(connection_sensor) }}"
              _event: "{{ 'Nett tilbake' if trigger.id == 'nett_on' else 'Nettutfall' }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[{{ _event }}] på {{ location_name }}"
            message: "Nettstatus: {{ _state }}"

      # ---------- STRØMBRUDD ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['power_fail','power_back'] }}"
        sequence:
          - variables:
              _event: "{{ 'Strøm tilbake' if trigger.id == 'power_back' else 'Strømbrudd' }}"
              _v: "{{ (states(voltage_entity) | float(0)) if voltage_entity != '' else 0 }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "[{{ _event }}] på {{ location_name }}"
            message: "Spenning: {{ _v }} V"

    default: []
