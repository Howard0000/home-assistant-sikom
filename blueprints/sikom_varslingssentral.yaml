blueprint:
  name: Sikom Varslingssentral
  description: >
    Varsler bare ekte endringer på Sikom-enheter og ignorerer pulser/flimring.
    • Bryter: Forrige status må ha vart minst vinduet + reverseringsvindu
    • Klima (preset/setpoint): Kun reverseringsvindu (HA har ikke pålitelig varighet per attributt)
    • Varsel sendes bare når sluttstatus ≠ startstatus og endringen sto stabilt hele vinduet.
  domain: automation
  source_url: https://raw.githubusercontent.com/Howard0000/home-assistant-sikom/main/blueprints/sikom_varslingssentral.yaml

  input:
    climate_entities:
      name: Termostater som skal overvåkes
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate

    critical_temperature:
      name: Kritisk temperaturgrense
      default: 5
      selector:
        number:
          min: -10
          max: 15
          step: 1
          unit_of_measurement: "°C"

    switch_entity:
      name: Bryter som skal overvåkes (valgfri)
      default: ""
      selector:
        entity:
          filter:
            - domain: switch

    connection_sensor:
      name: Tilkoblingssensor (valgfri)
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: connectivity

    notify_device:
      name: Varslingsenhet (mobile_app)
      selector:
        device:
          filter:
            - integration: mobile_app

    location_name:
      name: Navn på sted
      default: "Hytta"

    switch_window_min:
      name: Stabiliseringsvindu – Bryter (minutter)
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: min

    preset_window_sec:
      name: Stabiliseringsvindu – preset_mode (sekunder)
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: s

    temp_window_sec:
      name: Stabiliseringsvindu – setpoint (sekunder)
      default: 15
      selector:
        number:
          min: 5
          max: 300
          step: 1
          unit_of_measurement: s

    debug_mode:
      name: Debug (skriv til Loggbok hvorfor endring ble varslet/ignorert)
      default: false
      selector:
        boolean: {}

trigger:
  - trigger: numeric_state
    id: kritisk_temp
    entity_id: !input climate_entities
    attribute: current_temperature
    below: !input critical_temperature
    for: "00:01:00"

  - trigger: state
    id: klima_preset
    entity_id: !input climate_entities
    attribute: preset_mode

  - trigger: state
    id: klima_target
    entity_id: !input climate_entities
    attribute: temperature

  - trigger: state
    id: varmtvann_endret
    entity_id: !input switch_entity

  - trigger: state
    id: strombrudd
    entity_id: !input connection_sensor
    from: "on"
    to: "off"
    for: "00:01:00"

action:
  - variables:
      climate_entities: !input climate_entities
      switch_entity: !input switch_entity
      connection_sensor: !input connection_sensor
      location_name: !input location_name
      sw_min: !input switch_window_min
      p_sec: !input preset_window_sec
      t_sec: !input temp_window_sec
      debug_mode: !input debug_mode

  - choose:

      # ---------- BRYTER ----------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'varmtvann_endret'
                 and (switch_entity | length) > 0
                 and trigger.entity_id == switch_entity }}
        sequence:
          - variables:
              _old: "{{ trigger.from_state.state if trigger.from_state else 'unknown' }}"
              _new: "{{ trigger.to_state.state if trigger.to_state else 'unknown' }}"
              _old_dur: >-
                {{ (as_timestamp(trigger.to_state.last_changed)
                    - as_timestamp(trigger.from_state.last_changed)) | int }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Bryter start: old={{ _old }} ({{ _old_dur }}s), new={{ _new }}, vindu={{ sw_min }}m
                  entity_id: !input switch_entity

          # For bryter: forrige status må ha vart minst vinduet
          - condition: template
            value_template: >
              {{ _old_dur >= (sw_min | int) * 60 }}

          # Vent – ignorer hvis den går tilbake til _old
          - wait_for_trigger:
              - trigger: state
                entity_id: !input switch_entity
                to: "{{ _old }}"
            timeout:
              minutes: "{{ sw_min | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Bryter etter vent: wait.completed={{ wait.completed }}, nå={{ states(switch_entity) }}
                  entity_id: !input switch_entity

          # Send varsel kun hvis: ikke gått tilbake + fortsatt _new + netto endring
          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and is_state(switch_entity, _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (bryter): {{ state_attr(switch_entity, 'friendly_name') or switch_entity }} -> {{ 'PÅ' if _new == 'on' else 'AV' }}
                  entity_id: !input switch_entity

          - delay: "00:00:02"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "💧 {{ state_attr(switch_entity, 'friendly_name') or switch_entity }} ble {{ 'slått PÅ' if _new == 'on' else 'slått AV' }}."
            data:
              tag: "sikom_switch_status_{{ switch_entity | replace('.', '_') }}"

      # ---------- KLIMA: preset_mode ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_preset' and trigger.entity_id in climate_entities }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _old: "{{ (trigger.from_state.attributes.preset_mode if trigger.from_state else '') | string | lower | trim }}"
              _new: "{{ (trigger.to_state.attributes.preset_mode if trigger.to_state else '') | string | lower | trim }}"

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Preset start ({{ state_attr(_eid, 'friendly_name') or _eid }}):
                    old='{{ _old }}' -> new='{{ _new }}', vindu={{ p_sec }}s
                  entity_id: "{{ _eid }}"

          # Vent – ignorer hvis preset går tilbake til _old
          - wait_template: >
              {{ (state_attr(_eid, 'preset_mode') | string | lower | trim) == _old }}
            timeout:
              seconds: "{{ p_sec | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Preset etter vent: wait.completed={{ wait.completed }},
                    nå='{{ (state_attr(_eid,'preset_mode') | string | lower | trim) }}'
                  entity_id: "{{ _eid }}"

          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and ((state_attr(_eid, 'preset_mode') | string | lower | trim) == _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (preset): {{ state_attr(_eid, 'friendly_name') or _eid }} -> '{{ _new }}'
                  entity_id: "{{ _eid }}"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "🔄 Modus for {{ state_attr(_eid, 'friendly_name') or _eid }} er endret til '{{ _new }}'."

      # ---------- KLIMA: temperature (setpoint) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_target' and trigger.entity_id in climate_entities }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _old: "{{ (trigger.from_state.attributes.temperature if trigger.from_state else 0) | float(0) }}"
              _new: "{{ (trigger.to_state.attributes.temperature if trigger.to_state else 0) | float(0) }}"

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Setpoint start ({{ state_attr(_eid, 'friendly_name') or _eid }}):
                    old={{ _old }} -> new={{ _new }}, vindu={{ t_sec }}s
                  entity_id: "{{ _eid }}"

          # Vent – ignorer hvis setpoint går tilbake til _old
          - wait_template: >
              {{ (state_attr(_eid, 'temperature') | float(0)) == _old }}
            timeout:
              seconds: "{{ t_sec | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Setpoint etter vent: wait.completed={{ wait.completed }},
                    nå={{ (state_attr(_eid,'temperature') | float(0)) }}
                  entity_id: "{{ _eid }}"

          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and ((state_attr(_eid, 'temperature') | float(0)) == _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (setpoint): {{ state_attr(_eid, 'friendly_name') or _eid }} -> {{ _new }}°C
                  entity_id: "{{ _eid }}"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "🌡️ Måltemperatur for {{ state_attr(_eid, 'friendly_name') or _eid }} er endret til {{ _new }}°C."

      # ---------- STRØMBRUDD ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'strombrudd' }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: 🚨 KRITISK VARSEL"
            message: "⚠️ STRØMBRUDD registrert! Tilkoblingen til '{{ trigger.to_state.name | replace(' Tilkobling', '') }}' ble brutt."

mode: parallel
max: 10
