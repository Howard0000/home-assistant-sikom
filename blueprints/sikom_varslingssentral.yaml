blueprint:
  name: Sikom Varslingssentral
  description: >
    Varsler ekte endringer for Sikom – og skiller mellom NETTUTFALL (connection) og STRØMBRUDD (230V).
    • Nettutfall: connection (on/off) med stabiliseringsvindu (unngå falske alarmer)
    • Strømbrudd: spenningssensor (under terskel en periode, friskmelding med hysterese)
    • Klima/switch: varsler på endringer med stabiliseringsvinduer og debounce
  domain: automation
  source_url: https://raw.githubusercontent.com/Howard0000/home-assistant-sikom/main/blueprints/sikom_varslingssentral.yaml

  input:
    # --- Klima ---
    climate_entities:
      name: Termostater som skal overvåkes (valgfritt)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate

    critical_temperature:
      name: Kritisk temperaturgrense
      default: 5
      selector:
        number:
          min: -10
          max: 15
          step: 1
          unit_of_measurement: "°C"

    preset_window_sec:
      name: Stabiliseringsvindu – preset_mode (sek)
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 1
          unit_of_measurement: s

    temp_window_sec:
      name: Stabiliseringsvindu – setpoint (sek)
      default: 15
      selector:
        number:
          min: 5
          max: 300
          step: 1
          unit_of_measurement: s

    # --- Bryter ---
    switch_entity:
      name: Bryter som skal overvåkes (valgfri)
      default: ""
      selector:
        entity:
          filter:
            - domain: switch

    switch_window_min:
      name: Stabiliseringsvindu – Bryter (min)
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: min

    # --- Nett (connection) ---
    connection_sensor:
      name: Tilkoblingssensor – NETT (påkrevd for nettutfall)
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: connectivity

    connection_offline_min:
      name: Nettutfall – offline i minst (min)
      default: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min

    connection_online_min:
      name: Nett tilbake – online i minst (min)
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    # --- Strøm (spenning) ---
    voltage_entity:
      name: Spenningssensor – STRØM (valgfri)
      description: "For ekte strømbrudd: velg f.eks. 'Sikom ECO Energy Controller Spenning'"
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: voltage

    threshold_v:
      name: Strømbrudd – terskel (V)
      default: 50
      selector:
        number:
          min: 10
          max: 230
          step: 1
          unit_of_measurement: V

    hysteresis_v:
      name: Strøm tilbake – hysterese (V)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: V

    fail_for_min:
      name: Strømbrudd – under terskel i (min)
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    back_for_min:
      name: Strøm tilbake – over terskel i (min)
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min

    back_threshold_v:
      name: Strøm tilbake – terskel (V)
      default: 55
      selector:
        number:
          min: 10
          max: 230
          step: 1
          unit_of_measurement: V

    # --- Felles ---
    notify_device:
      name: Varslingsenhet (mobile_app)
      selector:
        device:
          filter:
            - integration: mobile_app

    location_name:
      name: Stedsnavn
      default: "Hytta"

    debug_mode:
      name: Debug (skriv hvorfor varsel/ignorert til Loggbok)
      default: false
      selector:
        boolean: {}

mode: parallel
max: 10

variables:
  climate_entities: !input climate_entities
  switch_entity: !input switch_entity
  connection_sensor: !input connection_sensor
  voltage_entity: !input voltage_entity
  location_name: !input location_name
  sw_min: !input switch_window_min
  p_sec: !input preset_window_sec
  t_sec: !input temp_window_sec
  offline_min: !input connection_offline_min
  online_min: !input connection_online_min
  thr_v: !input threshold_v
  hyst_v: !input hysteresis_v
  fail_min: !input fail_for_min
  back_min: !input back_for_min
  back_thr: !input back_threshold_v
  debug_mode: !input debug_mode

trigger:
  # --- Klima: sikkerhet ---
  - trigger: numeric_state
    id: kritisk_temp
    entity_id: !input climate_entities
    attribute: current_temperature
    below: !input critical_temperature
    for: "00:01:00"

  # --- Klima: endringer ---
  - trigger: state
    id: klima_preset
    entity_id: !input climate_entities
    attribute: preset_mode

  - trigger: state
    id: klima_target
    entity_id: !input climate_entities
    attribute: temperature

  # --- Bryter ---
  - trigger: state
    id: varmtvann_endret
    entity_id: !input switch_entity

  # --- NETTUTFALL (connection) ---
  - trigger: state
    id: nett_off
    entity_id: !input connection_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input connection_offline_min

  - trigger: state
    id: nett_on
    entity_id: !input connection_sensor
    from: "off"
    to: "on"
    for:
      minutes: !input connection_online_min

  # --- STRØMBRUDD (voltage) ---
  - trigger: numeric_state
    id: power_fail
    entity_id: !input voltage_entity
    below: !input threshold_v
    for:
      minutes: !input fail_for_min

  - trigger: numeric_state
    id: power_back
    entity_id: !input voltage_entity
    above: !input back_threshold_v
    for:
      minutes: !input back_for_min

action:
  - choose:

      # ---------- KLIMA: kritisk temperatur ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'kritisk_temp' }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _name: "{{ state_attr(_eid, 'friendly_name') or _eid }}"
              _temp: "{{ state_attr(_eid, 'current_temperature') }}"
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: 🚨 Lav temperatur"
            message: "⚠️ {{ _name }} har nå {{ _temp }}°C, under kritisk grense."
          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: "Kritisk temperatur varslet for {{ _name }} ({{ _temp }}°C)."
                  entity_id: "{{ _eid }}"

      # ---------- BRYTER ----------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'varmtvann_endret'
                 and (switch_entity | length) > 0
                 and trigger.entity_id == switch_entity }}
        sequence:
          - variables:
              _old: "{{ trigger.from_state.state if trigger.from_state else 'unknown' }}"
              _new: "{{ trigger.to_state.state if trigger.to_state else 'unknown' }}"
              _old_dur: >-
                {{ (as_timestamp(trigger.to_state.last_changed)
                    - as_timestamp(trigger.from_state.last_changed)) | int }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Bryter start: old={{ _old }} ({{ _old_dur }}s), new={{ _new }}, vindu={{ sw_min }}m
                  entity_id: !input switch_entity

          # For bryter: forrige status må ha vart minst vinduet
          - condition: template
            value_template: >
              {{ _old_dur >= (sw_min | int) * 60 }}

          # Vent – ignorer hvis den går tilbake til _old
          - wait_for_trigger:
              - trigger: state
                entity_id: !input switch_entity
                to: "{{ _old }}"
            timeout:
              minutes: "{{ sw_min | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Bryter etter vent: wait.completed={{ wait.completed }}, nå={{ states(switch_entity) }}
                  entity_id: !input switch_entity

          # Send varsel kun hvis: ikke gått tilbake + fortsatt _new + netto endring
          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and is_state(switch_entity, _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (bryter): {{ state_attr(switch_entity, 'friendly_name') or switch_entity }} -> {{ 'PÅ' if _new == 'on' else 'AV' }}
                  entity_id: !input switch_entity

          - delay: "00:00:02"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "💧 {{ state_attr(switch_entity, 'friendly_name') or switch_entity }} ble {{ 'slått PÅ' if _new == 'on' else 'slått AV' }}."
            data:
              tag: "sikom_switch_status_{{ switch_entity | replace('.', '_') }}"

      # ---------- KLIMA: preset_mode ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_preset' and trigger.entity_id in climate_entities }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _old: "{{ (trigger.from_state.attributes.preset_mode if trigger.from_state else '') | string | lower | trim }}"
              _new: "{{ (trigger.to_state.attributes.preset_mode if trigger.to_state else '') | string | lower | trim }}"

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Preset start ({{ state_attr(_eid, 'friendly_name') or _eid }}):
                    old='{{ _old }}' -> new='{{ _new }}', vindu={{ p_sec }}s
                  entity_id: "{{ _eid }}"

          # Vent – ignorer hvis preset går tilbake til _old
          - wait_template: >
              {{ (state_attr(_eid, 'preset_mode') | string | lower | trim) == _old }}
            timeout:
              seconds: "{{ p_sec | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Preset etter vent: wait.completed={{ wait.completed }},
                    nå='{{ (state_attr(_eid,'preset_mode') | string | lower | trim) }}'
                  entity_id: "{{ _eid }}"

          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and ((state_attr(_eid, 'preset_mode') | string | lower | trim) == _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (preset): {{ state_attr(_eid, 'friendly_name') or _eid }} -> '{{ _new }}'
                  entity_id: "{{ _eid }}"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "🔄 Modus for {{ state_attr(_eid, 'friendly_name') or _eid }} er endret til '{{ _new }}'."

      # ---------- KLIMA: temperature (setpoint) ----------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'klima_target' and trigger.entity_id in climate_entities }}"
        sequence:
          - variables:
              _eid: "{{ trigger.entity_id }}"
              _old: "{{ (trigger.from_state.attributes.temperature if trigger.from_state else 0) | float(0) }}"
              _new: "{{ (trigger.to_state.attributes.temperature if trigger.to_state else 0) | float(0) }}"

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Setpoint start ({{ state_attr(_eid, 'friendly_name') or _eid }}):
                    old={{ _old }} -> new={{ _new }}, vindu={{ t_sec }}s
                  entity_id: "{{ _eid }}"

          # Vent – ignorer hvis setpoint går tilbake til _old
          - wait_template: >
              {{ (state_attr(_eid, 'temperature') | float(0)) == _old }}
            timeout:
              seconds: "{{ t_sec | int }}"
            continue_on_timeout: true

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Setpoint etter vent: wait.completed={{ wait.completed }},
                    nå={{ (state_attr(_eid,'temperature') | float(0)) }}
                  entity_id: "{{ _eid }}"

          - condition: template
            value_template: >
              {{ (wait is defined and wait.completed == false)
                 and ((state_attr(_eid, 'temperature') | float(0)) == _new)
                 and (_new != _old) }}

          - if:
              - condition: template
                value_template: "{{ debug_mode }}"
            then:
              - action: logbook.log
                data:
                  name: "Sikom Debug"
                  message: >
                    Sender VARSEL (setpoint): {{ state_attr(_eid, 'friendly_name') or _eid }} -> {{ _new }}°C
                  entity_id: "{{ _eid }}"

          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ location_name }}: Endring registrert"
            message: "🌡️ Måltemperatur for {{ state_attr(_eid, 'friendly_name') or _eid }} er endret til {{ _new }}°C."

      # ---------- NETTUTFALL ----------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['nett_off','nett_on'] and (connection_sensor | length) > 0 }}
        sequence:
          - variables:
              nettnavn: "{{ state_attr(connection_sensor, 'friendly_name') or connection_sensor }}"
          - choose:
              - conditions: "{{ trigger.id == 'nett_off' }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ location_name }}: 🚨 NETTUTFALL"
                    message: "⚠️ Tilkoblingen til {{ nettnavn }} er OFFLINE (≥{{ offline_min }} min)."
              - conditions: "{{ trigger.id == 'nett_on' }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ location_name }}: Nett tilbake"
                    message: "✅ Tilkoblingen til {{ nettnavn }} er ONLINE igjen (≥{{ online_min }} min)."

      # ---------- STRØMBRUDD ----------
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['power_fail','power_back'] and (voltage_entity | length) > 0 }}
        sequence:
          - variables:
              volt_navn: "{{ state_attr(voltage_entity, 'friendly_name') or voltage_entity }}"
          - choose:
              - conditions: "{{ trigger.id == 'power_fail' }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ location_name }}: 🚨 STRØMBRUDD"
                    message: "⚠️ {{ volt_navn }} < {{ thr_v }} V i ≥{{ fail_min }} min."
              - conditions: "{{ trigger.id == 'power_back' }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ location_name }}: Strøm tilbake"
                    message: "✅ {{ volt_navn }} > {{ back_thr }} V i ≥{{ back_min }} min."
